# Connexions autorisees a joindre directement horuservices.cloud (bloc HTTPS du
# fichier nginx du depot) : Cloudflare et le serveur lui-meme. Tout le reste
# (robots et scanners qui visent l'IP du VPS pour contourner Cloudflare) recoit
# une fermeture de connexion (444).
#
# Installation (sur le serveur, AVANT la config du site qui utilise la variable) :
#   sudo install -m 644 /var/www/horusglobalservices/horusglobalservices/deploy/nginx-cloudflare-origine.conf /etc/nginx/conf.d/cloudflare-origine.conf
#
# On teste $realip_remote_addr (adresse TCP reelle de la connexion) et NON
# $remote_addr : cloudflare-realip.conf remplace deja $remote_addr par l'IP du
# visiteur (CF-Connecting-IP), qui n'est jamais une adresse Cloudflare.
#
# Plages identiques a cloudflare-realip.conf (https://www.cloudflare.com/ips/,
# relevees le 2026-10-26) : mettre les deux fichiers a jour ensemble.

geo $realip_remote_addr $acces_origine_autorise {
    default 0;

    # Le serveur lui-meme : sa surveillance locale interroge le site par
    # 127.0.0.1.
    127.0.0.1/32 1;
    ::1/128 1;

    173.245.48.0/20 1;
    103.21.244.0/22 1;
    103.22.200.0/22 1;
    103.31.4.0/22 1;
    141.101.64.0/18 1;
    108.162.192.0/18 1;
    190.93.240.0/20 1;
    188.114.96.0/20 1;
    197.234.240.0/22 1;
    198.41.128.0/17 1;
    162.158.0.0/15 1;
    104.16.0.0/13 1;
    104.24.0.0/14 1;
    172.64.0.0/13 1;
    131.0.72.0/22 1;
    2400:cb00::/32 1;
    2606:4700::/32 1;
    2803:f800::/32 1;
    2405:b500::/32 1;
    2405:8100::/32 1;
    2a06:98c0::/29 1;
    2c0f:f248::/32 1;
}
