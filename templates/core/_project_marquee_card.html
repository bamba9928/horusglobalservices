{% comment %} Carte projet du carrousel d'accueil. is_clone=True : copie decorative de la boucle
   (masquee aux lecteurs d'ecran et sortie de l'ordre de tabulation). {% endcomment %}
<div class="project-marquee__item{% if is_clone %} project-marquee__item--clone{% endif %}">
    <a href="{% url 'project_detail' project.slug %}"
       {% if is_clone %}aria-hidden="true" tabindex="-1"{% else %}aria-label="Voir le projet : {{ project.title }}"{% endif %}
       class="group block h-full bg-[#111114] border border-white/5 rounded-xl sm:rounded-2xl
              overflow-hidden hover:border-white/20 transition-all
              focus-visible:outline focus-visible:outline-2 focus-visible:outline-blue-400">

        <div class="relative aspect-video overflow-hidden bg-gray-900">
            {% if project.image %}
                <img src="{{ project.image.url }}"
                     alt="{% if not is_clone %}{{ project.title }}{% endif %}"
                     width="600"
                     height="337"
                     loading="lazy"
                     decoding="async"
                     class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500 sm:duration-700">
            {% else %}
                <div class="w-full h-full bg-gradient-to-br from-gray-800 to-gray-900
                            flex items-center justify-center text-gray-600" aria-hidden="true">
                    <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1"
                              d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                    </svg>
                </div>
            {% endif %}
            <div class="absolute inset-0 bg-gradient-to-t from-[#111114] to-transparent opacity-60"
                 aria-hidden="true"></div>
        </div>

        <div class="p-3 sm:p-4">
            <h3 class="text-sm sm:text-base text-white font-bold truncate group-hover:text-blue-400 transition-colors"
                aria-hidden="true">
                {{ project.title }}
            </h3>
            <p class="text-gray-400 text-xs sm:text-sm mt-1.5 line-clamp-2" aria-hidden="true">
                {{ project.description|truncatechars:80 }}
            </p>
        </div>
    </a>
</div>
