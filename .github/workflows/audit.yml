name: Audit des dépendances

# Echoue (croix rouge) si une dépendance Python épinglée a une faille connue.
# Volontairement SEPARE de ci.yml : une nouvelle faille ne doit pas bloquer le
# déploiement d'un correctif de contenu. Lundi 06:00 UTC pour détecter les
# nouveaux avis même sans commit.

on:
  schedule:
    - cron: "0 6 * * 1"
  push:
    branches: [main]
    paths: [requirements.txt, .github/workflows/audit.yml]
  pull_request:
    paths: [requirements.txt]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Audit de requirements.txt
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --no-deps --disable-pip
