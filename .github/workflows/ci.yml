name: CI/CD

# - Pull request / push sur main : tests (Django, migrations, templates, build CSS)
# - Push sur main uniquement   : déploiement automatique sur le VPS si les tests passent

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Même environnement que le dev local : SQLite, aucun secret réel.
    env:
      DJANGO_SECRET_KEY: ci-only-secret-key-not-used-in-production
      ENV: dev
      DEBUG: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Dépendances Python
        run: pip install -r requirements.txt

      # Erreurs de syntaxe et pyflakes (imports inutiles, noms indéfinis) : voir ruff.toml
      - name: Lint (ruff)
        run: |
          pip install ruff==0.16.10
          ruff check

      - name: Vérification Django
        run: python manage.py check

      # Le schéma fait partie du code : un modèle modifié sans migration
      # commitée casserait la prod au déploiement.
      - name: Migrations à jour
        run: python manage.py makemigrations --check --dry-run

      # Inclut la garde contre les commentaires {# #} multi-lignes (affichés en
      # clair sur le site) et la compilation de tous les templates.
      - name: Tests
        run: python manage.py test --verbosity 2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build Tailwind CSS
        run: |
          npm ci
          npm run build:css

  deploy:
    name: Déploiement
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    # Jamais deux déploiements en parallèle ; on laisse finir celui en cours.
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - name: Préparer la clé SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Empreinte du serveur figée dans un secret : pas de ssh-keyscan,
          # donc pas de confiance aveugle au premier contact.
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      # La clé est restreinte côté serveur (authorized_keys : restrict +
      # command=) : la connexion exécute uniquement le script de déploiement,
      # qui lance deploy.sh (git, pip, migrate, Tailwind, collectstatic,
      # redémarrage de gunicorn, healthcheck).
      - name: Déployer sur le VPS
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 \
            "$DEPLOY_USER@$DEPLOY_HOST"

      - name: Vérifier le site en production
        run: |
          for path in / /competences/ /portfolio/; do
            curl --fail --silent --show-error --output /dev/null \
              --retry 5 --retry-delay 5 --retry-all-errors --max-time 30 \
              "https://horuservices.cloud${path}"
            echo "OK ${path}"
          done
